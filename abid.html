<script>
const PWH="f84a581357d1fe5d3b9273dc614b155d107555104de9fbc8c47cb087bdaffb0b";
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}
var m=Math.pow,mw=m(2,32),i,j,res='',words=[],al=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};
for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(m(c,.5)*mw)|0;k[pc++]=(m(c,1/3)*mw)|0}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((al/mw)|0);words[words.length]=(al);
for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);
var t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
return res}

(function(){
 const lock=document.getElementById('lock');
 const pw=document.getElementById('pw'),msg=document.getElementById('pwm');let wrong=0,until=0;
 window.askAdmin=function(){pw.value='';msg.textContent='';lock.classList.add('on');setTimeout(()=>pw.focus(),60)};
 function tryLogin(){
  const now=Date.now();
  if(now<until){msg.textContent='wait '+Math.ceil((until-now)/1000)+'s';return}
  if(sha256(pw.value)===PWH){pw.value='';lock.classList.remove('on');try{localStorage.setItem('abid_owner','1')}catch(e){}showBoss();openAdmin();return}
  wrong++;pw.value='';msg.textContent='ACCESS DENIED';
  try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
  lock.classList.add('shk');setTimeout(()=>lock.classList.remove('shk'),400);
  if(wrong>=3){until=Date.now()+15000;wrong=0;msg.textContent='ACCESS DENIED - wait 15s'}
 }
 document.getElementById('pwb').addEventListener('click',tryLogin);
 document.getElementById('pwc').addEventListener('click',()=>{pw.value='';lock.classList.remove('on')});
 pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
})();

// ---- shared settings (public ntfy.sh relay) ----
const CFG_TOPIC='abid-cfg-931359092f190b4c';
function mineOwner(){try{return localStorage.getItem('abid_owner')==='1'}catch(e){return false}}
function showBoss(){const b=document.getElementById('boss');if(b)b.hidden=!mineOwner()}
function cleanCfg(o){
 if(!o||typeof o!=='object')return null;
 const out={},lim={start:40,link:300,n1:160,n2:240,voice:240,ig:40,igLabel:60,chat:64};
 for(const k in lim){if(typeof o[k]==='string'){const v=o[k].trim().slice(0,lim[k]);if(v)out[k]=v}}
 if(out.link&&!/^(https?|itms-apps):/i.test(out.link))delete out.link;
 if(out.chat&&!/^[A-Za-z0-9_-]{6,64}$/.test(out.chat))delete out.chat;
 out.v=Number(o.v)||0;return out}
function adoptCfg(c){
 if(!c||c.v<=(CFG.v||0))return false;
 CFG=Object.assign({},DEF,c);
 try{localStorage.setItem('abid_cfg',JSON.stringify(CFG))}catch(e){}
 applyCfg();return true}
async function fetchCfg(){
 try{
  const r=await fetch('https://ntfy.sh/'+CFG_TOPIC+'/json?poll=1&since=12h');
  if(!r.ok)return null;
  const txt=await r.text();let last=null;
  txt.split('\n').forEach(l=>{
   if(!l.trim())return;
   try{const m=JSON.parse(l);
    if(m.event==='message'&&Array.isArray(m.tags)&&m.tags.indexOf('cfg')>=0){
     const c=cleanCfg(JSON.parse(m.message));if(c&&(!last||c.v>last.v))last=c}}catch(e){}});
  return last}catch(e){return null}}
async function pushCfg(){
 try{
  const r=await fetch('https://ntfy.sh/'+CFG_TOPIC+'?tags=cfg',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(CFG)});
  if(!r.ok)throw new Error('http');
  am.textContent='saved - sent to everyone'}
 catch(e){am.textContent='saved on this phone only (no internet)'}}
async function syncCfg(){
 const r=await fetchCfg();
 if(r){adoptCfg(r);if(mineOwner()&&r.v<(CFG.v||0))pushCfg()}
 else if(mineOwner()&&CFG.v)pushCfg()}
showBoss();syncCfg();
setInterval(()=>{if(!document.hidden)syncCfg()},90000);

// ---- group chat (public ntfy.sh relay) ----
(function(){
 const chatEl=document.getElementById('chat'),list=document.getElementById('c_list'),st=document.getElementById('c_status'),
       nameBox=document.getElementById('c_name_box'),row=document.getElementById('c_row'),
       nameIn=document.getElementById('c_name'),msgIn=document.getElementById('c_msg');
 let name='',cid='',es=null,lastId='',seen=new Set(),timer=null,retry=0,curTopic='';
 try{name=localStorage.getItem('abid_chat_name')||'';cid=localStorage.getItem('abid_chat_id')||''}catch(e){}
 if(!cid){cid='u'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('abid_chat_id',cid)}catch(e){}}
 function myName(){return mineOwner()?'BOSS':name}
 function status(t){st.textContent=t}
 function state(){const has=!!myName();document.getElementById('c_rename').style.display=mineOwner()?'none':'';nameBox.classList.toggle('on',!has);row.classList.toggle('on',has);chatEl.classList.toggle('rdy',has)}
 function fmt(ts){try{return new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
 function addMsg(m){
  if(!m||m.event!=='message'||seen.has(m.id))return;
  seen.add(m.id);lastId=m.id;
  const mine=Array.isArray(m.tags)&&m.tags.indexOf(cid)>=0;const boss=Array.isArray(m.tags)&&m.tags.indexOf('boss')>=0;
  const d=document.createElement('div');d.className='m'+(mine?' me':'')+(boss?' boss':'');
  const b=document.createElement('b');b.textContent=boss?'👑 BOSS':(m.title||'anon');
  const t=document.createElement('span');t.textContent=m.message||'';t.dir='auto';
  const i=document.createElement('i');i.textContent=fmt(m.time);
  d.appendChild(b);d.appendChild(t);d.appendChild(i);
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
  list.appendChild(d);
  while(list.children.length>200)list.removeChild(list.firstChild);
  if(mine||near)list.scrollTop=list.scrollHeight;
 }
 function disconnect(){clearTimeout(timer);if(es){try{es.close()}catch(e){}es=null}}
 function connect(){
  disconnect();
  if(curTopic!==CFG.chat){curTopic=CFG.chat;list.textContent='';seen=new Set();lastId=''}
  status('connecting...');
  try{es=new EventSource('https://ntfy.sh/'+encodeURIComponent(curTopic)+'/sse?since='+(lastId||'12h'))}catch(e){status('chat not available');return}
  es.onopen=()=>{retry=0;status('online')};
  es.onmessage=e=>{try{addMsg(JSON.parse(e.data))}catch(x){}};
  es.onerror=()=>{
   status('reconnecting...');
   try{es.close()}catch(x){}es=null;
   retry=Math.min(retry+1,6);clearTimeout(timer);
   timer=setTimeout(()=>{if(chatEl.classList.contains('on'))connect()},2000*retry);
  };
 }
 async function send(){
  const nm=myName(),v=msgIn.value.trim();if(!v||!nm)return;
  msgIn.value='';
  try{
   const r=await fetch('https://ntfy.sh/'+encodeURIComponent(CFG.chat)+'?title='+encodeURIComponent(nm)+'&tags='+encodeURIComponent(mineOwner()?cid+',boss':cid),
     {method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:v.slice(0,500)});
   if(!r.ok)throw new Error('http');
  }catch(e){msgIn.value=v;status('could not send - check your internet')}
 }
 function openChat(){chatEl.classList.add('on');nameIn.value=name;state();if(myName())connect();else setTimeout(()=>nameIn.focus(),60)}
 function setName(){
  const n=nameIn.value.trim().slice(0,20);if(!n)return;
  if(/^\s*boss\s*$/i.test(n)){status('that name is reserved');return}
  name=n;try{localStorage.setItem('abid_chat_name',name)}catch(e){}
  state();connect();setTimeout(()=>msgIn.focus(),60);
 }
 document.getElementById('chb').addEventListener('click',openChat);
 document.getElementById('c_back').addEventListener('click',()=>{chatEl.classList.remove('on');disconnect()});
 document.getElementById('c_rename').addEventListener('click',()=>{name='';nameIn.value='';state();setTimeout(()=>nameIn.focus(),60)});
 document.getElementById('c_enter').addEventListener('click',setName);
 nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')setName()});
 document.getElementById('c_send').addEventListener('click',send);
 msgIn.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
})();
