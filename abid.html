<title>Abid</title>
<style>
:root{--bg:#050203;--panel:#0d0507;--line:#3a0a14;--red:#c4122f;--hot:#ff2a4d;--dim:#8a6a70;--txt:#e8d8da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
#rain{position:fixed;inset:0;opacity:.3;z-index:0}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#000 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#boot{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;justify-content:center;padding:0 7%;font-size:13px;color:var(--red);gap:3px}
#boot .l{white-space:pre-wrap}.ok{color:var(--hot)}
#tap{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--hot);font-size:15px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
#main{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 14px);opacity:0;transition:opacity 1.2s}
#main.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.logo{font-size:40px;font-weight:700;letter-spacing:.08em;color:var(--hot);text-shadow:0 0 20px #ff2a4d88;position:relative}
.logo::before,.logo::after{content:attr(data-t);position:absolute;left:0;top:0}
.logo::before{color:#fff;mix-blend-mode:screen;clip-path:inset(0 0 60% 0);animation:g1 4s infinite steps(1)}
.logo::after{color:#2affe6;mix-blend-mode:screen;clip-path:inset(60% 0 0 0);animation:g2 4s infinite steps(1)}
@keyframes g1{0%,92%,100%{transform:none}93%{transform:translate(-4px,0)}96%{transform:translate(3px,1px)}}
@keyframes g2{0%,90%,100%{transform:none}91%{transform:translate(4px,0)}95%{transform:translate(-3px,-1px)}}
#clock{font-size:22px;text-align:right}#date{font-size:11px;color:var(--dim);text-align:right}
#q{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:13px 14px;outline:0;border-radius:0;-webkit-user-select:text;user-select:text}
#q:focus{border-color:var(--red);box-shadow:0 0 22px #c4122f44}
#grid{margin-top:14px;flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.c{border:1px solid var(--line);background:var(--panel);padding:16px 4px 12px;text-align:center;font-size:12px;position:relative}
.c:active{border-color:var(--hot);background:#1a0509;transform:scale(.96)}
.c .i{width:46px;height:46px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--hot);border:1px solid var(--red);box-shadow:inset 0 0 14px #c4122f44}
.c .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.c .x{position:absolute;top:2px;right:6px;color:var(--dim);font-size:14px;padding:4px}
.add{border-style:dashed;color:var(--dim)}
.foot{font-size:10px;color:var(--dim);text-align:center;margin-top:8px}
#dlg{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center;padding:24px}
#dlg.on{display:flex}
#dlg div{background:var(--panel);border:1px solid var(--red);padding:18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#dlg input{background:#000;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:11px;border-radius:0;outline:0;-webkit-user-select:text;user-select:text}
#dlg small{color:var(--dim);font-size:11px;line-height:1.5}
#dlg button{background:var(--red);border:0;color:#fff;font:inherit;padding:12px}#dlg button.g{background:none;color:var(--dim)}
#ap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#3a0510 0%,#000 70%)}
#ap.on{display:flex;animation:flick 6.2s forwards}
#ap svg{width:70vw;max-width:300px;filter:drop-shadow(0 0 28px #ff2a4d99)}
#ap b{margin-top:18px;font-size:34px;letter-spacing:.35em;color:var(--hot);text-shadow:0 0 18px #ff2a4d}
.tear{fill:#c4122f;animation:fall 1.5s infinite ease-in}
.tear.b{animation-delay:.7s}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(70px);opacity:0}}
@keyframes flick{0%{opacity:0}6%{opacity:1}9%{opacity:.2}12%,90%{opacity:1}100%{opacity:0}}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{transform:scale(1.03)}}
.sw{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;padding:6px 10px;margin-top:6px}
.nt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;right:14px;display:flex;gap:12px;align-items:center;background:#1a0a0df2;border:1px solid var(--red);padding:12px 14px;transform:translateY(-160%);box-shadow:0 6px 30px #c4122f66;z-index:3}
.nt i{font-style:normal;width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-weight:700}
.nt strong{display:block;color:var(--hot);font-size:13px;margin-bottom:2px}.nt span{font-size:13px;color:var(--txt);line-height:1.4}
#n1{animation:nt 2.2s 1.3s forwards}#n2{animation:nt 2.6s 3.5s forwards}
@keyframes nt{0%{transform:translateY(-160%)}14%,86%{transform:translateY(0)}100%{transform:translateY(-160%)}}
.mid{flex:1;display:flex;align-items:center;justify-content:center}
#go{font:inherit;font-size:30px;letter-spacing:.3em;padding:26px 54px;background:#14060a;color:var(--hot);border:2px solid var(--red);border-radius:0;box-shadow:0 0 34px #c4122f66,inset 0 0 22px #c4122f44;text-shadow:0 0 14px #ff2a4d;animation:pl 1.8s infinite}
#go:active{background:var(--red);color:#fff;transform:scale(.96)}
.col{display:flex;flex-direction:column;align-items:center;gap:16px}
#tm,#admb,#chb,#aib{font:inherit;font-size:16px;letter-spacing:.35em;padding:14px 30px;background:#07030480;color:var(--dim);border:1px solid var(--line);border-radius:0}
#tm:active,#admb:active,#chb:active,#aib:active{border-color:var(--hot);color:var(--hot)}
#ig{display:inline-flex;align-items:center;gap:8px;color:var(--dim);border:1px solid var(--line);padding:9px 14px;font-size:12px;letter-spacing:.08em;text-decoration:none;margin-bottom:8px;background:#07030480}
#ig:active{color:var(--hot);border-color:var(--hot)}
#lock{position:fixed;inset:0;z-index:100;background:rgba(2,1,2,.96);display:none;align-items:center;justify-content:center;padding:24px}
#lock .lk{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;text-align:center}
#lock .lt{font-size:34px;letter-spacing:.35em;color:var(--hot);text-shadow:0 0 18px #ff2a4d}
#pw{background:#000;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:17px;padding:14px;text-align:center;border-radius:0;outline:0;letter-spacing:.2em;-webkit-user-select:text;user-select:text}
#pw:focus{border-color:var(--red);box-shadow:0 0 20px #c4122f55}
#pwb{font:inherit;font-size:16px;letter-spacing:.3em;padding:14px;background:#14060a;color:var(--hot);border:2px solid var(--red);border-radius:0}
#pwb:active{background:var(--red);color:#fff}
#pwm{min-height:18px;color:var(--hot);font-size:13px}
#lock.shk .lk{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#adm{position:fixed;inset:0;z-index:90;background:rgba(2,1,2,.97);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 30px)}
#adm.on{display:block}
#adm .ab{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#adm h3{color:var(--hot);letter-spacing:.3em;font-size:20px;margin-bottom:6px}
#adm label{color:var(--dim);font-size:12px;margin-top:6px}
#adm input{background:#000;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:11px;border-radius:0;outline:0;-webkit-user-select:text;user-select:text}
#adm input:focus{border-color:var(--red)}
#adm button{font:inherit;font-size:14px;letter-spacing:.2em;padding:12px;background:#14060a;color:var(--hot);border:1px solid var(--red);border-radius:0}
#adm button:active{background:var(--red);color:#fff}
.ar{display:flex;gap:8px;margin-top:10px}.ar button{flex:1}
#a_msg{color:var(--dim);min-height:18px;font-size:13px}
#chat{position:fixed;inset:0;z-index:85;background:rgba(2,1,2,.97);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
#chat.on{display:flex}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ct{color:var(--hot);letter-spacing:.25em;font-size:14px}
.ch button{font:inherit;font-size:12px;color:var(--dim);background:none;border:1px solid var(--line);padding:7px 10px;border-radius:0}
#c_status{font-size:11px;color:var(--dim);min-height:16px;padding:4px 0}
#c_name_box{margin:auto 0;display:none;flex-direction:column;gap:12px;text-align:center}
#c_name_box.on{display:flex}
.cn{color:var(--txt);font-size:16px}
#c_name,#c_msg{background:#000;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:12px;border-radius:0;outline:0;-webkit-user-select:text;user-select:text}
#c_name:focus,#c_msg:focus{border-color:var(--red)}
#c_enter,#c_send{font:inherit;font-size:14px;letter-spacing:.2em;padding:12px 16px;background:#14060a;color:var(--hot);border:1px solid var(--red);border-radius:0}
#c_list{flex:1;overflow:auto;display:none;flex-direction:column;gap:8px;padding:8px 0;-webkit-overflow-scrolling:touch}
#chat.rdy #c_list{display:flex}
#c_row{display:none;gap:8px}#c_row.on{display:flex}#c_msg{flex:1;min-width:0}
.m{max-width:82%;align-self:flex-start;background:#0d0507;border:1px solid var(--line);padding:8px 10px;overflow-wrap:anywhere}
.m.me{align-self:flex-end;border-color:var(--red);background:#1a0509}
.m b{display:block;color:var(--hot);font-size:11px;margin-bottom:2px;font-weight:normal}
.m i{display:block;font-style:normal;color:var(--dim);font-size:10px;margin-top:3px;text-align:right}
#c_online{font-size:11px;color:var(--dim);padding:0 0 4px}
#pwc{font:inherit;font-size:13px;letter-spacing:.2em;padding:10px;background:none;color:var(--dim);border:1px solid var(--line);border-radius:0}
#lock.on{display:flex}
#boss{color:#ffd400;font-size:12px;letter-spacing:.2em;text-align:right;margin-top:4px;text-shadow:0 0 10px #ffd40088}
.m.boss{border-color:#ffd400;background:#1a1500}.m.boss b{color:#ffd400}
#ai{position:fixed;inset:0;z-index:84;background:rgba(2,1,2,.97);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
#ai.on{display:flex}
#ai .ah{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#ai .ah button,.ac button{font:inherit;font-size:12px;color:var(--dim);background:none;border:1px solid var(--line);padding:7px 10px;border-radius:0}
#ai .at{color:var(--hot);letter-spacing:.25em;font-size:14px}
#ai_sub{font-size:11px;color:var(--dim);padding:6px 0;line-height:1.5}
.ac{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.ac button{white-space:nowrap;flex:none}
#ai_list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0;-webkit-overflow-scrolling:touch}
.am{max-width:88%;padding:9px 11px;overflow-wrap:anywhere;line-height:1.5;font-size:14px;border:1px solid var(--line);background:#0d0507;align-self:flex-start}
.am.u{align-self:flex-end;border-color:var(--red);background:#1a0509}
.am .ls{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.am .ls button{font:inherit;font-size:12px;text-align:left;color:var(--hot);background:#14060a;border:1px solid var(--red);padding:8px 10px;border-radius:0}
#ai_row{display:flex;gap:8px;padding-top:6px}
#ai_in{flex:1;min-width:0;background:#000;border:1px solid var(--line);color:var(--txt);font:inherit;font-size:16px;padding:12px;border-radius:0;outline:0;-webkit-user-select:text;user-select:text}
#ai_in:focus{border-color:var(--red)}
#ai_send{font:inherit;font-size:14px;letter-spacing:.2em;padding:12px 16px;background:#14060a;color:var(--hot);border:1px solid var(--red);border-radius:0}
.am{-webkit-user-select:text;user-select:text}
.am pre{background:#000;border:1px solid var(--line);padding:8px;margin:6px 0;overflow-x:auto;white-space:pre;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left}
.ctl{display:flex;gap:6px;margin-top:6px}
.ctl button{font:inherit;font-size:10px;color:var(--dim);background:none;border:1px solid var(--line);padding:3px 7px;border-radius:0}

const PWH="f84a581357d1fe5d3b9273dc614b155d107555104de9fbc8c47cb087bdaffb0b";
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}
var m=Math.pow,mw=m(2,32),i,j,res='',words=[],al=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};
for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(m(c,.5)*mw)|0;k[pc++]=(m(c,1/3)*mw)|0}}
ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((al/mw)|0);words[words.length]=(al);
for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);
var t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
return res}

function cleanCfg(o){
 if(!o||typeof o!=='object')return null;
 const out={},lim={start:40,link:300,n1:160,n2:240,voice:240,ig:40,igLabel:60,chat:64,repo:80};
 for(const k in lim){if(typeof o[k]==='string'){const v=o[k].trim().slice(0,lim[k]);if(v)out[k]=v}}
 if(out.link&&!/^(https?|itms-apps):/i.test(out.link))delete out.link;
 if(out.chat&&!/^[A-Za-z0-9_-]{6,64}$/.test(out.chat))delete out.chat;if(out.repo&&!/^[\w.-]+\/[\w.-]+$/.test(out.repo))delete out.repo;

function adoptCfg(c){
 if(!c||c.v<=(CFG.v||0))return false;
 CFG=Object.assign({},DEF,c);
 try{localStorage.setItem('abid_cfg',JSON.stringify(CFG))}catch(e){}
 applyCfg();return true}
async function fetchCfg(){

  const r=await fetch('https://ntfy.sh/'+CFG_TOPIC+'/json?poll=1&since=12h');

   if(!l.trim())return;
   try{const m=JSON.parse(l);
    if(m.event==='message'&&Array.isArray(m.tags)&&m.tags.indexOf('cfg')>=0){
     const c=cleanCfg(JSON.parse(m.message));if(c&&(!last||c.v>last.v))last=c}}catch(e){}});
  return last}catch(e){return null}}

function aiNorm(s){return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}\s./-]/gu,' ').replace(/\s+/g,' ').trim()}

function aiRepoIn(q){
 if(!/(latest|آخر|اخر|newest|release)/.test(q))return null;
 for(const k in AI_REPOS){if(q.indexOf(k)>=0)return AI_REPOS[k]}
